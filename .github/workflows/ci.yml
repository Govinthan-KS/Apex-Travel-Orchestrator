name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          INTERNAL_SHARED_SECRET: "test-ci-shared-secret-key-32-chars-long"
          GROQ_API_KEY: "mock-groq-api-key"
          GOOGLE_API_KEY: "mock-google-api-key"
          HUGGINGFACE_API_KEY: "mock-hf-api-key"
          PINECONE_API_KEY: "mock-pinecone-api-key"
          PINECONE_INDEX_NAME: "apex-test-index"
          AVIATIONSTACK_API_KEY: "mock-aviationstack-api-key"
          TAVILY_API_KEY: "mock-tavily-api-key"
          OPENTRIPMAP_API_KEY: "mock-opentripmap-api-key"
        run: |
          pytest tests -v

  frontend-check:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Vitest
        run: npm run test

      - name: Run Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ESLint
        # Note: 18 pre-existing lint errors exist in legacy code and will fail this step
        # as documented in Stage 0 deliverable; they are not fixed in this stage.
        run: npm run lint

      - name: Run Next.js Build
        env:
          NEXTAUTH_SECRET: "test-ci-auth-secret-key-32-chars-long"
          AUTH_SECRET: "test-ci-auth-secret-key-32-chars-long"
          INTERNAL_SHARED_SECRET: "test-ci-shared-secret-key-32-chars-long"
          MONGODB_URI: "mongodb://localhost:27017/apex-test"
        run: npm run build
